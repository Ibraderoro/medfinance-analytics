name: ${COMPOSE_PROJECT_NAME:-medfinance-e2e}

services:
  postgres:
    image: postgres:16-alpine
    command: postgres -c shared_preload_libraries=pg_stat_statements -c pg_stat_statements.track=all -c pg_stat_statements.max=1000
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medfinance_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-medfinance_e2e}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medfinance_e2e_password}
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=512m
    ports:
      # Host-published only so scripts/performance/** (which cannot go through the
      # nginx `edge` proxy — it 404s /health/ready by design) can reach Postgres
      # directly for perf:db:analyze. Not used by the Playwright e2e suite.
      - "127.0.0.1:${PERF_PG_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medfinance_e2e} -d ${POSTGRES_DB:-medfinance_e2e}"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [e2e]

  redis:
    image: redis:7-alpine
    command: redis-server --save '' --appendonly no --requirepass ${REDIS_PASSWORD:-medfinance_e2e_redis_password}
    tmpfs:
      - /data:rw,noexec,nosuid,size=128m
    ports:
      # Host-published only for scripts/performance/run-redis-check.js; unused by
      # the Playwright e2e suite.
      - "127.0.0.1:${PERF_REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-medfinance_e2e_redis_password}", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [e2e]

  migrator:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: "no"
    environment: &backend_env
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-medfinance_e2e}:${POSTGRES_PASSWORD:-medfinance_e2e_password}@postgres:5432/${POSTGRES_DB:-medfinance_e2e}
      PG_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-medfinance_e2e_redis_password}
      JWT_SECRET: ${JWT_SECRET:-e2e_jwt_secret_that_is_at_least_32_chars}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-e2e_refresh_secret_that_is_at_least_32_chars}
      AUDIT_EXPORT_SIGNING_SECRET: ${AUDIT_EXPORT_SIGNING_SECRET:-e2e_audit_secret_that_is_at_least_32_chars}
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${E2E_HTTP_PORT:-8080},http://localhost:${E2E_HTTP_PORT:-8080}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_e2e_secret}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_e2e_pro}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-price_e2e_enterprise}
      ANALYTICS_SAMPLE_RATE: "0"
      # Defaults match production; the perf-release-candidate CI job overrides these
      # via shell env before `docker compose up` so sustained load-test traffic from
      # a single source IP doesn't trip the limiter. Unset for the Playwright e2e
      # suite, which keeps production-equivalent limits.
      RATE_LIMIT_GENERAL_MAX: ${RATE_LIMIT_GENERAL_MAX:-200}
      RATE_LIMIT_GENERAL_WINDOW_MS: ${RATE_LIMIT_GENERAL_WINDOW_MS:-900000}
      RATE_LIMIT_AUTH_MAX: ${RATE_LIMIT_AUTH_MAX:-20}
      RATE_LIMIT_AUTH_WINDOW_MS: ${RATE_LIMIT_AUTH_WINDOW_MS:-900000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "apps/backend/dist/db/migrate.js"]
    networks: [e2e]

  seed:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-medfinance_e2e_password}
    volumes:
      - ./infrastructure/postgres/seed.sql:/seed.sql:ro
      - ./scripts/e2e/seed-e2e.sql:/seed-e2e.sql:ro
    command: >-
      sh -c "psql -h postgres -U ${POSTGRES_USER:-medfinance_e2e} -d ${POSTGRES_DB:-medfinance_e2e} -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;' && psql -h postgres -U ${POSTGRES_USER:-medfinance_e2e} -d ${POSTGRES_DB:-medfinance_e2e} -v ON_ERROR_STOP=1 -f /seed.sql && psql -h postgres -U ${POSTGRES_USER:-medfinance_e2e} -d ${POSTGRES_DB:-medfinance_e2e} -v ON_ERROR_STOP=1 -f /seed-e2e.sql"
    depends_on:
      migrator:
        condition: service_completed_successfully
    networks: [e2e]

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment: *backend_env
    ports:
      # Host-published only so scripts/performance/** can reach the backend
      # directly — the nginx `edge` proxy 404s /health/ready and other
      # perf-relevant internal routes by design.
      - "127.0.0.1:${PERF_BACKEND_PORT:-3001}:3001"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.js"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    networks: [e2e]

  worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    command: ["node", "apps/backend/dist/worker.js"]
    environment:
      <<: *backend_env
      WORKER_HEALTH_PORT: 3002
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck-worker.js"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s
    networks: [e2e]

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [e2e]

  edge:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${E2E_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    environment:
      CSP_CONNECT_SRC: ""
    command:
      - /bin/sh
      - -c
      - envsubst '$$CSP_CONNECT_SRC' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 3s
      timeout: 3s
      retries: 40
    networks: [e2e]

networks:
  e2e:
    driver: bridge
