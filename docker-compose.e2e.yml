services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medfinance_e2e}
      POSTGRES_USER: ${POSTGRES_USER:-medfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medfinance}
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medfinance} -d ${POSTGRES_DB:-medfinance_e2e}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    ports:
      - "${REDIS_HOST_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  db_prepare:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: builder
    restart: "no"
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://${POSTGRES_USER:-medfinance}:${POSTGRES_PASSWORD:-medfinance}@postgres:5432/${POSTGRES_DB:-medfinance_e2e}
      PG_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-12345678901234567890123456789012}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-22345678901234567890123456789012}
      AUDIT_EXPORT_SIGNING_SECRET: ${AUDIT_EXPORT_SIGNING_SECRET:-32345678901234567890123456789012}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_integration_secret}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_pro_test}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-price_enterprise_test}
      ANALYTICS_SAMPLE_RATE: "1"
    command: >-
      sh -c "npm run migrate:preflight --workspace=apps/backend &&
             npm run migrate --workspace=apps/backend &&
             npm run seed --workspace=apps/backend"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-medfinance}:${POSTGRES_PASSWORD:-medfinance}@postgres:5432/${POSTGRES_DB:-medfinance_e2e}
      PG_SSL: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      JWT_SECRET: ${JWT_SECRET:-12345678901234567890123456789012}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-22345678901234567890123456789012}
      AUDIT_EXPORT_SIGNING_SECRET: ${AUDIT_EXPORT_SIGNING_SECRET:-32345678901234567890123456789012}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_integration_secret}
      STRIPE_PRO_PRICE_ID: ${STRIPE_PRO_PRICE_ID:-price_pro_test}
      STRIPE_ENTERPRISE_PRICE_ID: ${STRIPE_ENTERPRISE_PRICE_ID:-price_enterprise_test}
      ANALYTICS_SAMPLE_RATE: "1"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:8088,http://localhost:8088}
      OPS_ALLOWLIST_CIDRS: ${OPS_ALLOWLIST_CIDRS:-0.0.0.0/0,::/0}
      OPS_ENDPOINT_AUTH_ENABLED: "false"
    depends_on:
      db_prepare:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "/app/scripts/healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    environment:
      CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf.template:ro
    command:
      - /bin/sh
      - -c
      - envsubst '$$CSP_CONNECT_SRC' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'
    ports:
      - "${NGINX_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 20
