name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  vulnerability-scan:
    name: Vulnerability scan (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2"
    with:
      scan-args: |-
        -r
        ./

  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail-closed npm audit (high+)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint --workspaces --if-present

      - name: Test
        run: npm test

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: npm run test:e2e:install --workspace=apps/frontend

      - name: Frontend e2e smoke test
        run: npm run test:e2e:mock --workspace=apps/frontend
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: medfinance
          POSTGRES_PASSWORD: medfinance
          POSTGRES_DB: medfinance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medfinance -d medfinance_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Deterministic test-only values for ephemeral CI integration containers; safe to hardcode for reproducible infra-backed tests.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://medfinance:medfinance@127.0.0.1:5432/medfinance_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_TLS: "false"
      PG_SSL: "false"
      JWT_SECRET: 12345678901234567890123456789012
      REFRESH_TOKEN_SECRET: 22345678901234567890123456789012
      AUDIT_EXPORT_SIGNING_SECRET: 32345678901234567890123456789012
      STRIPE_WEBHOOK_SECRET: whsec_integration_secret
      STRIPE_PRO_PRICE_ID: price_pro_test
      STRIPE_ENTERPRISE_PRICE_ID: price_enterprise_test
      ANALYTICS_SAMPLE_RATE: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fail-closed backend production npm audit (high+)
        run: npm audit --audit-level=high --workspace=apps/backend --omit=dev

      - name: Migration preflight
        run: npm run migrate:preflight --workspace=apps/backend

      - name: Run backend Postgres/Redis integration tests
        run: npm run test:integration --workspace=apps/backend


  full-stack-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: validate
    env:
      COMPOSE_PROJECT_NAME: medfinance-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_HTTP_PORT: 8080
      E2E_BASE_URL: http://127.0.0.1:8080
      DOCKER_BUILDKIT: 1
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browser
        run: npm run test:e2e:install --workspace=apps/frontend

      - name: Run Docker-backed full-stack E2E
        env:
          E2E_PRESERVE_ON_FAILURE: 1
        run: npm run e2e:full-stack

      - name: Upload full-stack Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-e2e-report
          path: |
            apps/frontend/playwright-report/full-stack
            apps/frontend/test-results

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Tear down Docker-backed full-stack E2E
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
