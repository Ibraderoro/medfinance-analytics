name: CD — Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  validate-staging:
    name: Validate staging candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fail-closed npm audit (high+)
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm run test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          REDIS_HOST: ${{ secrets.STAGING_REDIS_HOST }}
          REDIS_PORT: ${{ secrets.STAGING_REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.STAGING_REFRESH_TOKEN_SECRET }}

  build-staging-images:
    name: Build immutable staging images
    needs: validate-staging
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      backend-image: ${{ steps.manifest.outputs.backend_image }}
      frontend-image: ${{ steps.manifest.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          version="staging-${GITHUB_SHA::12}"
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/backend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.namespace }}/backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/frontend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.namespace }}/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build release manifest
        id: manifest
        env:
          DEPLOY_ENVIRONMENT: staging
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.namespace }}/backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.namespace }}/frontend@${{ steps.frontend.outputs.digest }}
        run: |
          npm run release:manifest
          npm run release:manifest:check -- --file release-manifest.json
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-manifest
          path: release-manifest.json
          if-no-files-found: error

  deploy-staging:
    name: Health-gated blue/green staging deploy
    needs: build-staging-images
    runs-on: [self-hosted, medfinance-staging]
    environment: staging
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download release manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-release-manifest

      - name: Validate release manifest
        run: npm run release:manifest:check -- --file release-manifest.json

      - name: Log in to container registry on deploy host
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy pinned staging release
        env:
          STAGING_PUBLIC_URL: ${{ vars.STAGING_PUBLIC_URL }}
          STAGING_DEPLOY_BASE_DIR: ${{ vars.STAGING_DEPLOY_BASE_DIR }}
          STAGING_SECRET_ENV_FILE: ${{ vars.STAGING_SECRET_ENV_FILE }}
        run: |
          : "${STAGING_PUBLIC_URL:?Set STAGING_PUBLIC_URL environment variable in GitHub Environments}"
          bash infrastructure/deployment/deploy-bluegreen.sh \
            --environment staging \
            --version "${{ needs.build-staging-images.outputs.version }}" \
            --backend-image "${{ needs.build-staging-images.outputs.backend-image }}" \
            --frontend-image "${{ needs.build-staging-images.outputs.frontend-image }}" \
            --public-url "$STAGING_PUBLIC_URL" \
            --base-dir "${STAGING_DEPLOY_BASE_DIR:-/opt/medfinance}" \
            --env-file "${STAGING_SECRET_ENV_FILE:-/opt/medfinance/secrets/staging.env}"
