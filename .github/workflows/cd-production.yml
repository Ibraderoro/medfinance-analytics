name: CD — Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g. v1.2.3)'
        required: true

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint checks
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_HOST: ${{ secrets.PROD_REDIS_HOST }}
          REDIS_PORT: ${{ secrets.PROD_REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.PROD_REFRESH_TOKEN_SECRET }}
          AUDIT_EXPORT_SIGNING_SECRET: ${{ secrets.TEST_AUDIT_EXPORT_SIGNING_SECRET }}

      - name: Build all workspaces
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version tag
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:latest
            ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:latest
            ghcr.io/${{ github.repository }}/frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd /opt/medfinance
            docker compose pull
            docker compose up -d postgres redis
            docker compose run --rm backend node apps/backend/dist/db/migrate.js
            docker compose up -d --remove-orphans

      - name: Verify production readiness with retries
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          if [ -z "$PROD_HOST" ]; then
            echo "PROD_HOST is required for readiness checks" >&2
            exit 1
          fi

          host="${PROD_HOST#https://}"
          host="${host#http://}"
          host="${host%/}"
          url="https://${host}/api/v1/health/ready"
          max_attempts=8
          delay=5

          for attempt in $(seq 1 "$max_attempts"); do
            echo "Readiness check attempt ${attempt}/${max_attempts}"
            if curl --fail --silent --show-error --max-time 10 "$url"; then
              echo "Production readiness check succeeded"
              exit 0
            fi

            if [ "$attempt" -eq "$max_attempts" ]; then
              echo "Production readiness check failed after ${max_attempts} attempts" >&2
              exit 1
            fi

            sleep "$delay"
            delay=$((delay * 2 > 60 ? 60 : delay * 2))
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
