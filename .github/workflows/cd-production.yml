name: CD — Production

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to deploy (e.g. v1.2.3)'
        required: true

permissions:
  actions: read
  contents: read

jobs:
  vulnerability-scan:
    name: Vulnerability scan (OSV)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2"
    with:
      scan-args: |-
        -r
        ./

  validate:
    name: Validate release candidate
    needs: vulnerability-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Fail-closed npm audit (high+)
        run: npm audit --audit-level=high

      - name: Run lint checks
        run: npm run lint

      - name: Run production coverage gate
        run: npm run coverage:prod
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          REDIS_HOST: ${{ secrets.PROD_REDIS_HOST }}
          REDIS_PORT: ${{ secrets.PROD_REDIS_PORT }}
          REDIS_PASSWORD: ${{ secrets.PROD_REDIS_PASSWORD }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          REFRESH_TOKEN_SECRET: ${{ secrets.PROD_REFRESH_TOKEN_SECRET }}
          AUDIT_EXPORT_SIGNING_SECRET: ${{ secrets.TEST_AUDIT_EXPORT_SIGNING_SECRET }}

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Build all workspaces
        run: npm run build

      - name: Install Playwright browser
        run: npm run test:e2e:install --workspace=apps/frontend

      - name: Frontend e2e smoke test
        run: npm run test:e2e --workspace=apps/frontend

      - name: Verify staging operational drill gate
        run: npm run staging:drills:check

      - name: Verify external provider evidence gate
        run: npm run production:external-evidence:check

  perf-release-candidate:
    name: Release-candidate performance validation
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Advisory only while thresholds are calibrated against real release runs — a
    # failure here surfaces in the UI and uploaded report but does not block
    # build-images/deploy-production. Revisit once several releases have
    # established stable baselines.
    continue-on-error: true
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: medfinance-perf-${{ github.run_id }}-${{ github.run_attempt }}
      DOCKER_BUILDKIT: 1
      RATE_LIMIT_GENERAL_MAX: "100000"
      RATE_LIMIT_GENERAL_WINDOW_MS: "60000"
      RATE_LIMIT_AUTH_MAX: "20000"
      RATE_LIMIT_AUTH_WINDOW_MS: "60000"
      PERF_BASE_URL: http://127.0.0.1:3001/api/v1
      DATABASE_URL: postgresql://medfinance_e2e:medfinance_e2e_password@127.0.0.1:5433/medfinance_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      REDIS_PASSWORD: medfinance_e2e_redis_password
      PERF_EMAIL: perf@medfinance.test
      PERF_PASSWORD: PerfTest123!
      PERF_ORGANIZATION_ID: ff6a1c0f-6d3b-8388-6b12-4e2ad21f57c5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Boot backend + worker for perf validation
        run: docker compose -f docker-compose.e2e.yml up --build --wait --wait-timeout 180 backend worker

      - name: Install k6, psql, and redis-tools
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6 postgresql-client redis-tools

      - name: k6 peak load
        run: PERF_PROFILE=peak npm run perf:load:peak

      - name: API micro-benchmark
        if: ${{ !cancelled() }}
        run: npm run perf:api:bench

      - name: Database performance analysis
        if: ${{ !cancelled() }}
        run: npm run perf:db:analyze

      - name: Redis latency check
        if: ${{ !cancelled() }}
        run: npm run perf:redis:check

      - name: Consolidated performance report
        if: ${{ !cancelled() }}
        run: npm run perf:report

      - name: Restore performance baseline (read-only reference)
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: artifacts/performance/baseline.json
          key: perf-baseline-main-${{ github.run_id }}
          restore-keys: |
            perf-baseline-main-

      - name: Regression check vs latest known baseline
        if: ${{ !cancelled() }}
        run: npm run perf:regression:check

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: perf-artifacts-release-${{ github.event.inputs.version || github.ref_name }}
          path: artifacts/performance/**
          retention-days: 90
          if-no-files-found: warn

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Tear down perf validation stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans

  build-images:
    name: Build immutable images
    needs: [validate, perf-release-candidate]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      backend-image: ${{ steps.manifest.outputs.backend_image }}
      frontend-image: ${{ steps.manifest.outputs.frontend_image }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - name: Set image metadata
        id: meta
        env:
          RAW_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          version="$RAW_VERSION"
          if [[ ! "$version" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid deployment version '${RAW_VERSION}'. Only letters, numbers, dots, dashes, and underscores are allowed." >&2
            exit 1
          fi
          namespace="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "namespace=${namespace}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Log in to container registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        id: backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: infrastructure/docker/backend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/backend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.namespace }}/backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Build and push frontend image
        id: frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: .
          file: infrastructure/docker/frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.meta.outputs.namespace }}/frontend:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.namespace }}/frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Trivy scan backend image (critical only)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.namespace }}/backend@${{ steps.backend.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Trivy scan frontend image (critical only)
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.namespace }}/frontend@${{ steps.frontend.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate backend SBOM
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.namespace }}/backend@${{ steps.backend.outputs.digest }}
          format: cyclonedx
          output: backend.sbom.cdx.json
          exit-code: '0'

      - name: Generate frontend SBOM
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ${{ steps.meta.outputs.namespace }}/frontend@${{ steps.frontend.outputs.digest }}
          format: cyclonedx
          output: frontend.sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-image-sboms
          path: |
            backend.sbom.cdx.json
            frontend.sbom.cdx.json
          if-no-files-found: error

      - name: Cosign sign backend image
        run: cosign sign --yes ${{ steps.meta.outputs.namespace }}/backend@${{ steps.backend.outputs.digest }}

      - name: Cosign sign frontend image
        run: cosign sign --yes ${{ steps.meta.outputs.namespace }}/frontend@${{ steps.frontend.outputs.digest }}

      - name: Attest backend provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.namespace }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true

      - name: Attest frontend provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.meta.outputs.namespace }}/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true

      - name: Build release manifest
        id: manifest
        env:
          DEPLOY_ENVIRONMENT: production
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          BACKEND_IMAGE: ${{ steps.meta.outputs.namespace }}/backend@${{ steps.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ steps.meta.outputs.namespace }}/frontend@${{ steps.frontend.outputs.digest }}
        run: |
          npm run release:manifest
          npm run release:manifest:check -- --file release-manifest.json
          echo "backend_image=${BACKEND_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${FRONTEND_IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Upload release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: production-release-manifest
          path: release-manifest.json
          if-no-files-found: error

  deploy-production:
    name: Health-gated blue/green deploy
    needs: build-images
    runs-on: [self-hosted, medfinance-production]
    environment: production
    permissions:
      contents: write
      packages: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          persist-credentials: false
      - name: Download release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: production-release-manifest

      - name: Validate release manifest
        run: npm run release:manifest:check -- --file release-manifest.json

      - name: Log in to container registry on deploy host
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy pinned release
        env:
          PROD_PUBLIC_URL: ${{ vars.PROD_PUBLIC_URL }}
          PROD_DEPLOY_BASE_DIR: ${{ vars.PROD_DEPLOY_BASE_DIR }}
          PROD_SECRET_ENV_FILE: ${{ vars.PROD_SECRET_ENV_FILE }}
        run: |
          : "${PROD_PUBLIC_URL:?Set PROD_PUBLIC_URL environment variable in GitHub Environments}"
          bash infrastructure/deployment/deploy-bluegreen.sh \
            --environment production \
            --version "${{ needs.build-images.outputs.version }}" \
            --backend-image "${{ needs.build-images.outputs.backend-image }}" \
            --frontend-image "${{ needs.build-images.outputs.frontend-image }}" \
            --public-url "$PROD_PUBLIC_URL" \
            --base-dir "${PROD_DEPLOY_BASE_DIR:-/opt/medfinance}" \
            --env-file "${PROD_SECRET_ENV_FILE:-/opt/medfinance/secrets/app.env}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: release-manifest.json
