name: Performance — Weekly stress & soak

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  perf-weekly-stress-soak:
    name: Weekly stress/spike/soak (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: medfinance-perf-weekly-${{ github.run_id }}
      DOCKER_BUILDKIT: 1
      RATE_LIMIT_GENERAL_MAX: "100000"
      RATE_LIMIT_GENERAL_WINDOW_MS: "60000"
      RATE_LIMIT_AUTH_MAX: "20000"
      RATE_LIMIT_AUTH_WINDOW_MS: "60000"
      PERF_BASE_URL: http://127.0.0.1:3001/api/v1
      DATABASE_URL: postgresql://medfinance_e2e:medfinance_e2e_password@127.0.0.1:5433/medfinance_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6380"
      REDIS_PASSWORD: medfinance_e2e_redis_password
      PERF_EMAIL: perf@medfinance.test
      PERF_PASSWORD: PerfTest123!
      PERF_ORGANIZATION_ID: ff6a1c0f-6d3b-8388-6b12-4e2ad21f57c5
      # Keep the soak run short enough for a scheduled CI slot; the k6 script itself
      # still supports multi-hour soaks locally via the same env var.
      PERF_SOAK_DURATION: 20m
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Boot backend + worker for perf validation
        run: docker compose -f docker-compose.e2e.yml up --build --wait --wait-timeout 180 backend worker

      - name: Install k6
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://dl.k6.io/key.gpg | sudo gpg --dearmor -o /etc/apt/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/etc/apt/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      # Informational only: this workflow never fails the run on threshold or
      # regression findings, so `|| true` on every perf step and the final report.
      - name: k6 step stress
        run: npm run perf:stress:step || true

      - name: k6 spike stress
        run: npm run perf:stress:spike || true

      - name: k6 soak
        run: npm run perf:soak || true

      - name: Consolidated performance report
        run: npm run perf:report || true

      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-artifacts-weekly-${{ github.run_id }}
          path: artifacts/performance/**
          retention-days: 30
          if-no-files-found: warn

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color

      - name: Tear down perf validation stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down --volumes --remove-orphans
