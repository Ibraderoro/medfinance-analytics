services:
  - type: web
    name: medfinance-backend
    runtime: docker
    repo: https://github.com/your-org/medfinance-analytics
    rootDir: .
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    plan: starter
    autoDeploy: true
    healthCheckPath: /api/v1/health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: LOG_LEVEL
        value: info
      - key: DATABASE_URL
        fromDatabase:
          name: medfinance-postgres
          property: connectionString
      - key: PG_SSL
        value: "true"
      - key: PG_SSL_REJECT_UNAUTHORIZED
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: medfinance-redis
          property: connectionString
      - key: REDIS_TLS
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: CORS_ALLOWED_ORIGINS
        value: https://your-frontend-domain.com

  - type: redis
    name: medfinance-redis
    ipAllowList: []
    plan: starter

databases:
  - name: medfinance-postgres
    plan: starter
    databaseName: medfinance
    user: medfinance_user
