# Redis production configuration for MedFinance Analytics

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Authentication is set via CLI --requirepass flag in docker-compose

# Memory management
maxmemory 512mb
maxmemory-policy allkeys-lru

# Persistence — light RDB snapshotting
save 900 1
save 300 10
save 60 10000
dbfilename dump.rdb
dir /data

# Disable appendonly for cache workloads (reduce I/O)
appendonly no

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# Logging
loglevel notice
logfile ""

# TCP
tcp-keepalive 300
timeout 0
