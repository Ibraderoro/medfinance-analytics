global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Scrape the backend directly on the internal observability Docker network.
  # Do not route Prometheus metrics through the public Nginx listener.
  #
  # When OPS_ENDPOINT_AUTH_ENABLED=true on the backend (recommended in production),
  # uncomment the authorization block below and set the same token value as
  # OPS_ENDPOINT_AUTH_TOKEN in your environment secrets.
  - job_name: medfinance-backend
    metrics_path: /api/v1/internal/observability/metrics
    # authorization:
    #   credentials: <your-OPS_ENDPOINT_AUTH_TOKEN-value>
    static_configs:
      - targets: ['backend:3001']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
