global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: medfinance-backend
    metrics_path: /api/v1/internal/observability/metrics
    static_configs:
      - targets: ['backend:3001']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']
